MEMORY {
	BIOS: start = $F000, size = $1000, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
	TABLE:   load = BIOS, type = ro, start = $F000;
	TRAPS:   load = BIOS, type = ro, start = $F036;
	CODE:    load = BIOS, type = ro;
	COMPOSITOR: load = BIOS, type = ro, align = $100;
	SMALL_REDRAW: load = BIOS, type = ro;
	VECTORS: load = BIOS, type = ro, start = $FFFA;
}
